<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="brutal-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#1E1E1E" />
    </filter>
  </defs>

  <!-- Background Squircle / Sticker Base in Nexora Terracotta -->
  <rect x="3" y="3" width="56" height="56" rx="16" fill="#D96E3D" stroke="#1E1E1E" stroke-width="3" filter="url(#brutal-shadow)" />

  <!-- Shutter Button (Red Vintage Trigger) -->
  <rect x="15" y="12" width="8" height="5" rx="2" fill="#E5484D" stroke="#1E1E1E" stroke-width="2" />

  <!-- Flash Unit (Warm Vintage Bulb) -->
  <rect x="37" y="11" width="12" height="6" rx="2.5" fill="#FDE047" stroke="#1E1E1E" stroke-width="2" />
  <circle cx="43" cy="14" r="1.8" fill="#F59E0B" />

  <!-- Camera Body (Warm Cream Canvas) -->
  <rect x="10" y="16" width="42" height="34" rx="8" fill="#FAF8F4" stroke="#1E1E1E" stroke-width="2.5" />

  <!-- Vintage Horizon Accent Line -->
  <path d="M10 25.5 H52" stroke="#E2DCD0" stroke-width="2" />
  <path d="M10 25.5 H23" stroke="#D96E3D" stroke-width="2" />

  <!-- Camera Lens Base -->
  <circle cx="31" cy="34" r="12" fill="#1E1E1E" />
  <circle cx="31" cy="34" r="9.5" fill="#2E4A3E" />
  <circle cx="31" cy="34" r="6" fill="#14231E" />

  <!-- Cool Pixel Sunglasses (⌐■-■) Over Lens -->
  <polygon points="18,27 29,27 28,35 19,35" fill="#1E1E1E" stroke="#FAF8F4" stroke-width="1.2" />
  <rect x="28" y="29" width="5" height="2" fill="#1E1E1E" stroke="#FAF8F4" stroke-width="0.8" />
  <polygon points="32,27 43,27 42,35 33,35" fill="#1E1E1E" stroke="#FAF8F4" stroke-width="1.2" />
  
  <!-- Sunglasses White Glare Slashes -->
  <line x1="21" y1="29" x2="23" y2="34" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" />
  <line x1="35" y1="29" x2="37" y2="34" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" />

  <!-- Cheeky Smug Smirk Under the Glasses -->
  <path d="M28 42.5 Q31 45.5 35 42.5" stroke="#1E1E1E" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Cute Dimple Cheeks -->
  <circle cx="26" cy="42" r="1" fill="#D96E3D" />
  <circle cx="37" cy="42" r="1" fill="#D96E3D" />

  <!-- Magic Sparkle Star (Top Right Corner) -->
  <path d="M51 6 Q51 11 56 11 Q51 11 51 16 Q51 11 46 11 Q51 11 51 6 Z" fill="#FCD34D" stroke="#1E1E1E" stroke-width="1.5" />
  <circle cx="51" cy="11" r="1.2" fill="#FFFFFF" />

  <!-- Tiny Sparkle (Bottom Left Corner) -->
  <path d="M7 47 Q7 49 9 49 Q7 49 7 51 Q7 49 5 49 Q7 49 7 47 Z" fill="#FDE047" stroke="#1E1E1E" stroke-width="1" />
</svg>